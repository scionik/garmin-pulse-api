name: Fetch Garmin heart rate

on:
  schedule:
    # Nominally every 5 min. GitHub delays scheduled runs under load, so the
    # real cadence lands nearer 15-20 min -- asking for 5 buys headroom, it is
    # not a promise. Fine either way: the watch is the actual bottleneck.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch heart rate data
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python3 scripts/fetch_garmin.py

      - name: Commit updated pulse.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pulse.json
          git diff --staged --quiet && echo "No change" || git commit -m "Update pulse.json"
          git push
