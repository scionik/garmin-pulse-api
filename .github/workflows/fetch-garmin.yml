name: Fetch Garmin heart rate

on:
  schedule:
    # BACKSTOP ONLY. cron-job.org drives the real cadence by hitting the
    # workflow_dispatch API every 10 min, because GitHub throttles *scheduled*
    # workflows hard -- measured gaps here ran 28 min to 11 hours under */5,
    # which is what left the widget 8 hours stale on 2026-08-27.
    #
    # Kept at a slow cadence so there is still a pulse if cron-job.org dies or
    # its token expires, while rarely colliding with a dispatched run.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

# Two triggers land within seconds of each other now and then. Without this
# they both fetch, both commit, and the loser's push is rejected with
# "! [rejected] main -> main (fetch first)". Queue them instead of racing;
# never cancel, because the run that is already mid-fetch is the fresher one.
concurrency:
  group: fetch-garmin
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch heart rate data
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python3 scripts/fetch_garmin.py

      - name: Commit updated pulse.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pulse.json

          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi

          git commit -m "Update pulse.json"

          # Belt as well as braces: concurrency should stop the race, but a
          # push can still lose to a commit that landed while this job ran.
          # pulse.json is a full snapshot, so rebasing on top is always safe --
          # whichever fetch is newer simply wins.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing and retrying"
            git pull --rebase
          done

          echo "Could not push after 3 attempts"
          exit 1
